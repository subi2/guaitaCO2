:root{
  --bg:#0E1116; --bg-deep:#0B0D10; --bg-deep2:#12161B; --bg-panel:#171B21; --bg-surface:#1E232B;
  --bg-control:#1E232B; --bg-track:#0E1116; --bg-hover:#252B34;
  --border:#2A313B; --border-soft:#222831; --border-hov:#3A424E; --border-strong:#4A5361;
  --text:#D6DBE1; --text-soft:#C6CCD4; --text-strong:#D6DBE1; --text-mid:#AEB6C0;
  --text-mut:#8B939F; --text-dim:#8B939F; --text-dim2:#5C6470; --text-faint:#454C57;
  --accent:#D6FB41; --accent-hover:#E2FF6E; --accent-line:#D6FB41; --accent-text:#D6FB41;
  --on-accent:#1A2000; --accent-ink:#D6FB41;
  --accent-soft:rgba(214,251,65,.08); --accent-soft2:rgba(214,251,65,.18);
  --green:#6EE7A8; --green-bg:#12261D; --cyan:#4DD0E1; --cyan-bg:#0F2226;
  --err-bg:#3A1A1E; --err-text:#FFD0D0; --danger:#FF5E5E; --warn:#FFB546; --warn-bg:#3A2F10; --warn-text:#FFD98A; --warn-line:#F5B942;
  --overlay-bg:rgba(23,27,33,.96); --viewport:#D5D9DE; --shadow:rgba(0,0,0,.55);
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body.light{
  --bg:#F4F5F7; --bg-deep:#ECEEF1; --bg-deep2:#F0F2F5; --bg-panel:#FFFFFF; --bg-surface:#F1F3F5;
  --bg-control:#FFFFFF; --bg-track:#E6E9ED; --bg-hover:#E9ECF0;
  --border:#D5DAE0; --border-soft:#E6E9ED; --border-hov:#B8C0CA; --border-strong:#9AA3AE;
  --text:#161A20; --text-soft:#23282F; --text-strong:#161A20; --text-mid:#3D4652;
  --text-mut:#5C6470; --text-dim:#6B7380; --text-dim2:#8B939F; --text-faint:#A9B0B9;
  --accent:#D6FB41; --accent-hover:#CDF232; --accent-line:#8DB300; --accent-text:#5E7700;
  --on-accent:#1A2000; --accent-ink:#5E7700;
  --accent-soft:rgba(141,179,0,.10); --accent-soft2:rgba(141,179,0,.22);
  --green:#2E8A57; --green-bg:#E3F4EA; --cyan:#00806A; --cyan-bg:#DFF2ED;
  --err-bg:#FBE3E0; --err-text:#A92315; --danger:#D93636; --warn:#B86E00; --warn-bg:#FDF0D0; --warn-text:#7A5200; --warn-line:#B86E00;
  --overlay-bg:rgba(255,255,255,.96); --viewport:#DADDE2; --shadow:rgba(0,0,0,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;font-size:12px;color:inherit}
button{padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-control);color:var(--text-soft);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:var(--bg-hover);border-color:var(--border-strong)}
button.pri{background:var(--accent);border-color:var(--accent-line);color:var(--on-accent);font-weight:600}
button.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.ghost{background:none;border-color:transparent}
button.ghost:hover{background:var(--bg-hover);border-color:var(--border)}
button:disabled{opacity:.35;cursor:not-allowed}
input,select,textarea{background:var(--bg-control);border:1px solid var(--border);border-radius:4px;padding:4px 7px;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)}
input:disabled{opacity:.5}
input[type=checkbox]{accent-color:var(--accent-line)}
textarea{width:100%;resize:vertical;min-height:70px;font-family:var(--sans);font-size:13px}
.mono,.num{font-family:var(--mono)}
.num{text-align:right;white-space:nowrap}
.mu{color:var(--text-dim)}
.ac{color:var(--accent-text)}
/* capçalera */
header.top{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border-bottom:2px solid var(--accent-line);padding:7px 14px 6px;flex:none;position:relative;z-index:50}
.brandw{display:flex;align-items:center;gap:8px;margin-right:6px}
.cells{display:grid;grid-template-columns:7px 7px;gap:2px;flex:none}
.cells i{display:block;width:7px;height:7px}
.cells i:nth-child(1){background:#D6FB41}.cells i:nth-child(2){background:#FF2ECC}.cells i:nth-child(3){background:#00E5FF}.cells i:nth-child(4){background:#FFE500}
.brand{font:900 17px 'Arial Black',system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-text)}
.brand em{font-style:normal;color:var(--text)}
.ver{font:10px var(--mono);color:var(--text-dim2);border:1px solid var(--border);border-radius:3px;padding:0 5px;margin-left:2px}
nav.menu{display:flex;gap:2px}
.mi{position:relative}
.mi>.mb{background:transparent;border:1px solid transparent;color:var(--text-soft);font:600 12px system-ui,sans-serif;letter-spacing:.5px;padding:5px 11px;border-radius:4px}
.mi.open>.mb,.mi>.mb:hover{background:var(--bg-hover);border-color:var(--border-strong);color:var(--accent-text)}
.dd{display:none;position:absolute;left:0;top:100%;min-width:250px;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:6px;padding:4px;box-shadow:0 8px 24px var(--shadow);margin-top:4px;z-index:60}
.open>.dd{display:block}
.dd .it{display:flex;justify-content:space-between;gap:18px;padding:7px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;position:relative;font:12px system-ui,sans-serif;color:var(--text-soft)}
.dd .it:hover{background:var(--accent-soft2);color:var(--accent-text)}
.dd .it.dis{opacity:.35;pointer-events:none}
.dd .it.chk::before{content:'✓';position:absolute;left:-1px;color:var(--accent-text);font-size:11px}
.dd .sep{height:1px;background:var(--border);margin:4px 2px}
.dd .sub>.dd{left:100%;top:-5px;margin-top:0}
.dd .sub:hover>.dd{display:block}
.dd .it .k{color:var(--text-dim2);font-size:10px}
.sp{flex:1}

/* ---------- Icones (SVG de traç, estil guaitaPDF) ---------- */

/* ---------- Format de números (català) ---------- */
function loc(v, d) {
  try { return v.toLocaleString('ca-ES', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  catch (e) { return v.toFixed(d).replace('.', ','); }
}
/* nombre amb xifres adaptatives (per a valors de CO2e que van de 1e-6 a 1e6) */
U.fmtV = function (v) {
  if (v == null || typeof v !== 'number' || isNaN(v)) return '';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1000) return loc(v, 0);
  if (a >= 100) return loc(v, 1);
  if (a >= 1) return loc(v, 2);
  if (a >= 0.01) return loc(v, 3);
  return v.toExponential(2).replace('.', ',').replace('e', 'e');
};
U.fmt = (v, d) => (v == null || typeof v !== 'number' || isNaN(v)) ? '' : loc(v, d == null ? 2 : d);
U.fmtPct = v => (v == null || isNaN(v)) ? '' : (v > 0 ? '+' : '') + loc(v, 1) + ' %';
U.fmtD = (v, d) => (v == null || isNaN(v)) ? '' : (v > 0 ? '+' : '') + loc(v, d == null ? 2 : d);
U.numIn = s => { s = String(s == null ? '' : s).trim(); if (s === '') return null; const n = Number(s.replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? NaN : n; };

/* ---------- Modals ---------- */
U.modal = function (title, body, buttons, opts) {
  opts = opts || {};

    const close = v => { m.remove(); document.removeEventListener('keydown', kd, true); res(v); };
    const kd = e => { if (e.key !== 'Escape') return; const all = document.querySelectorAll('.modal'); if (all[all.length - 1] !== m) return; e.stopPropagation(); close(undefined); };
    const bs = (buttons || [{ l: 'Tanca', v: true, pri: 1 }]).map(b => h('button', { class: b.pri ? 'pri' : '', onclick: () => { if (b.check && !b.check()) return; close(b.v); } }, b.l));

/* fields: [{k,l,v,type:'text'|'number'|'select'|'check'|'area',opts:[[v,l]]}] → objecte o null */
U.ask = async function (title, fields, intro, okLabel) {
  const els = {}; const rows = [];
  if (intro) rows.push(h('p', { class: 'mu' }, intro));

    let e;

    else if (f.type === 'area') e = h('textarea', { value: f.v == null ? '' : f.v });

U.download = function (name, content, mime) {

/* ===== store.js ===== */
/* guaitaCO2 — emmagatzematge local (IndexedDB): biblioteca ÖKOBAUDAT, preus i projecte de treball */
const ST = GC.store = {};
let _idb = null;
function openIDB() {
  if (_idb) return _idb;
  _idb = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('guaitaCO2', 1);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('IndexedDB bloquejada'));
    } catch (e) { rej(e); }
  });

}

ST.get = async function (k) {
  try { const d = await openIDB(); return await new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch (e) { ST.ok = false; return undefined; }
};

  catch (e) { ST.ok = false; return false; }
};
ST.del = async function (k) {
  try { const d = await openIDB(); return await new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(true); t.onerror = () => rej(t.error); }); }
  catch (e) { ST.ok = false; return false; }

C.autoLevel = function (it, ctx, o, n) {
  const ds = ctx.ds(it.dsId); if (!ds) return 1; n = n || 3;
  for (let L = ds.cat.length; L >= 1; L--) { const A = C.alts(it, ctx, Object.assign({}, o, { level: L })); if (A.list.filter(a => a.complete).length >= n) return L; }
  return 1;
};

/* ===== state.js ===== */
/* guaitaCO2 — estat del projecte: elements, escenaris, preus, desfés/refés i desat automàtic */
const S = GC.S = {
  p: null,            // projecte
  sel: null,          // id d'element seleccionat
  view: 'lib',        // vista activa
  cmp: null,          // id de l'escenari base de comparació
  ui: { vis: { A: true, A4: false, B: false, C: false, D: true } }
};
const EMPTY_SETTINGS = () => ({ ind: 't', counted: ['A1-A3'], cprice: null, unitOut: 'kg', area: null, period: 50, b4mode: 'dataset' });
S.newProject = function (name) {
  const sid = U.uid();
  return {
    format: 'guaitaCO2-projecte', version: VERSION, name: name || 'Projecte sense títol', created: new Date().toISOString(), modified: new Date().toISOString(),
    source: { db: 'ÖKOBAUDAT', release: '', note: 'Dades d\'ÖKOBAUDAT (BMWSB / BBSR). Distribució gratuïta de dades sense modificar amb citació de la font.' },
    settings: EMPTY_SETTINGS(), prices: {}, ds: {}, solutions: [], refs: [],
    scenarios: [{ id: sid, name: 'Base', items: [] }], active: sid,
    caseInfo: null
  };
};
S.scn = () => S.p.scenarios.find(s => s.id === S.p.active) || S.p.scenarios[0];
S.scnById = id => S.p.scenarios.find(s => s.id === id);
S.items = () => S.scn().items;
S.item = id => S.items().find(i => i.id === id);
/* dataset d'un identificador: biblioteca activa, o la còpia de seguretat incrustada al projecte */
S.dsOf = function (id) {
  if (!id) return null; const d = GC.odb.get(id); if (d) return d; return (S.p && S.p.ds && S.p.ds[id]) || null;
};
S.ctx = function () {
  const st = S.p.settings; return { ind: st.ind, counted: st.counted.filter(m => M.COUNTABLE.indexOf(m) >= 0), prices: S.p.prices, ds: S.dsOf, cprice: st.cprice, period: st.period, b4mode: st.b4mode };
};
S.res = function (scn) { return C.scn((scn || S.scn()).items, S.ctx()); };
S.kscale = () => S.p.settings.unitOut === 't' ? 0.001 : 1;
S.kunit = () => S.p.settings.unitOut === 't' ? 't CO₂e' : 'kg CO₂e';

/* ---------- Desfés / refés (instantànies del projecte) ---------- */
const UNDO = [], REDO = [];
S.canUndo = () => UNDO.length > 0; S.canRedo = () => REDO.length > 0;
let lastSnap = null;
S.snap = function () { lastSnap = JSON.stringify(S.p); };
/* aplica un canvi: desa instantània prèvia, executa fn, desa i refresca */
S.change = function (fn, what) {
  if (!lastSnap) S.snap();
  UNDO.push(lastSnap); if (UNDO.length > 80) UNDO.shift(); REDO.length = 0;
  fn(); S.p.modified = new Date().toISOString(); S.snap(); S.save(); if (GC.refresh) GC.refresh(what || 'data');
};
S.undo = function () { if (!UNDO.length) return; REDO.push(JSON.stringify(S.p)); S.p = JSON.parse(UNDO.pop()); S.snap(); S.save(); if (GC.refresh) GC.refresh('proj'); };
S.redo = function () { if (!REDO.length) return; UNDO.push(JSON.stringify(S.p)); S.p = JSON.parse(REDO.pop()); S.snap(); S.save(); if (GC.refresh) GC.refresh('proj'); };
S.setProject = function (p, keepUndo) {
  S.p = p; S.sel = null; S.cmp = null; S.cmp2 = null; if (!keepUndo) { UNDO.length = 0; REDO.length = 0; } S.snap(); S.save(); if (GC.refresh) GC.refresh('proj');
};

/* ---------- Desat automàtic ---------- */
let saveT = null;
S.save = function () {
  clearTimeout(saveT);
  saveT = setTimeout(() => { if (S.p) GC.store.set('project', S.p).then(ok => { if (!ok && !S.warnedStore) { S.warnedStore = true; U.status('No es pot desar al navegador (emmagatzematge no disponible). Desa el projecte en un fitxer JSON.', 'wr', 8000); } }); }, 400);
};
S.flush = async function () { clearTimeout(saveT); if (S.p) await GC.store.set('project', S.p); };
S.loadSaved = async function () {
  const p = await GC.store.get('project'); if (p && p.format === 'guaitaCO2-projecte' && Array.isArray(p.scenarios) && p.scenarios.length) { S.p = S.normalize(p); S.snap(); return true; }
  return false;
};
/* completa camps absents (projectes d'altres versions) */
S.normalize = function (p) {
  p.settings = Object.assign(EMPTY_SETTINGS(), p.settings || {}); p.prices = p.prices || {}; p.ds = p.ds || {}; p.solutions = p.solutions || []; p.refs = p.refs || [];
  if (!Array.isArray(p.settings.counted)) p.settings.counted = ['A1-A3'];
  for (const sc of p.scenarios) { sc.items = sc.items || []; for (const it of sc.items) { if (it.conv == null) it.conv = 1; if (it.qty == null) it.qty = 0; if (!it.unit) it.unit = '?'; } }
  if (!p.active || !p.scenarios.find(s => s.id === p.active)) p.active = p.scenarios[0].id;
  return p;
};

/* ---------- Operacions amb elements ---------- */
S.newItem = function (o) {
  return Object.assign({ id: U.uid(), name: '', group: '', dsId: null, qty: 1, unit: '?', conv: 1, price: null, vi: null, note: '' }, o || {});
};
/* guarda còpia del dataset al projecte perquè es pugui obrir sense la biblioteca */
S.keepDs = function (d) { if (d && S.p.ds && !S.p.ds[d.id]) { const o = Object.assign({}, d); delete o._s; S.p.ds[d.id] = o; } };
S.addFromDs = function (d, qty) {
  let id; S.change(() => {
    S.keepDs(d); const rel = GC.odb.lib && GC.odb.lib.meta && GC.odb.lib.meta.release; if (rel && !S.p.source.release) S.p.source.release = rel;
    const it = S.newItem({ name: d.n, dsId: d.id, unit: d.u, qty: qty == null ? 1 : qty }); id = it.id; S.items().push(it);
  });
  S.sel = id; if (GC.refresh) GC.refresh('sel'); return id;
};
S.addBlank = function () { let id; S.change(() => { const it = S.newItem({ name: 'Element nou' }); id = it.id; S.items().push(it); }); S.sel = id; if (GC.refresh) GC.refresh('sel'); return id; };
S.dupItem = function (id) {
  const it = S.item(id); if (!it) return; let nid;
  S.change(() => { const c = U.clone(it); c.id = U.uid(); c.name = it.name + ' (còpia)'; nid = c.id; const a = S.items(); a.splice(a.indexOf(it) + 1, 0, c); });
  S.sel = nid; if (GC.refresh) GC.refresh('sel');
};
S.delItem = function (id) {
  const it = S.item(id); if (!it) return; S.change(() => { const a = S.items(); a.splice(a.indexOf(it), 1); });
  if (S.sel === id) S.sel = null; if (GC.refresh) GC.refresh('sel');
};
/* assigna un dataset a un element, amb conversió suggerida si la unitat difereix */
S.assignDs = function (itemId, d, keepConv) {
  const it = S.item(itemId); if (!it) return;
  S.change(() => {
    S.keepDs(d); const old = S.dsOf(it.dsId); it.dsId = d.id; it.vi = null;
    const itU = M.itemUnit(it.unit);
    if (!keepConv) {
      if (itU === '?' || !itU) { it.unit = d.u; it.conv = 1; }
      else { const s = C.suggest(itU, d); it.conv = s ? s.f : 1; if (!s && itU !== d.u) it.convWarn = true; else delete it.convWarn; }
    }
    if (old && old.id !== d.id && it.price != null) { it.price = null; }
  });
};
S.setScenario = function (id) { if (S.scnById(id)) { S.p.active = id; S.sel = null; if (GC.refresh) GC.refresh('scn'); S.save(); } };
S.newScenario = function (name, fromId) {
  const src = S.scnById(fromId) || S.scn(); let id;
  S.change(() => { const c = { id: U.uid(), name: name || ('Escenari ' + (S.p.scenarios.length + 1)), items: U.clone(src.items) }; id = c.id; S.p.scenarios.push(c); S.p.active = id; }, 'scn');
  return id;
};
S.renameScenario = function (id, name) { const s = S.scnById(id); if (s) S.change(() => { s.name = name; }, 'scn'); };
S.delScenario = function (id) {
  if (S.p.scenarios.length < 2) return; S.change(() => { const a = S.p.scenarios; a.splice(a.findIndex(s => s.id === id), 1); if (S.p.active === id) S.p.active = a[0].id; }, 'scn');
  if (S.cmp === id) S.cmp = null;
};
S.setSetting = function (k, v) { S.change(() => { S.p.settings[k] = v; }, 'set'); };
S.toggleCounted = function (mod) {
  S.change(() => { const a = S.p.settings.counted; const i = a.indexOf(mod); if (i >= 0) a.splice(i, 1); else a.push(mod); a.sort((x, y) => M.COUNTABLE.indexOf(x) - M.COUNTABLE.indexOf(y)); }, 'set');
};
S.setPrice = function (dsId, v) { S.change(() => { if (v == null || isNaN(v)) delete S.p.prices[dsId]; else S.p.prices[dsId] = v; }, 'price'); };

/* ---------- Solucions compostes (capes) ---------- */
S.newLayer = function (d, o) { return Object.assign({ id: U.uid(), name: d ? d.n : '', dsId: d ? d.id : null, qty: 1, unit: d ? d.u : '?', conv: 1, rsl: null, vi: null }, o || {}); };
S.layerAssign = function (l, d) {
  S.keepDs(d); l.dsId = d.id; l.vi = null; if (!l.name) l.name = d.n; const lu = M.itemUnit(l.unit);
  if (lu === '?' || !lu) { l.unit = d.u; l.conv = 1; } else { const s = C.suggest(lu, d); l.conv = s ? s.f : 1; }
};
S.addSolution = function (sol, qty) {
  let id; S.change(() => {
    const layers = U.clone(sol.layers); for (const l of layers) { l.id = U.uid(); const d = S.dsOf(l.dsId) || (sol.ds && sol.ds[l.dsId]); if (d && !S.p.ds[d.id] && !GC.odb.get(d.id)) S.p.ds[d.id] = d; }
    const it = S.newItem({ name: sol.name, unit: sol.unit || 'm2', qty: qty == null ? 1 : qty, layers, solId: sol.id, group: sol.group || '' }); id = it.id; S.items().push(it);
  }); S.sel = id; if (GC.refresh) GC.refresh('sel'); return id;
};
/* instantània d'una solució amb els datasets que usa (per a la llibreria local, que viatja sola) */
S.solSnapshot = function (name, unit, layers, id) {
  const ds = {}; for (const l of layers) { const d = S.dsOf(l.dsId); if (d) { const o = Object.assign({}, d); delete o._s; ds[d.id] = o; } }
  return { id: id || U.uid(), name, unit: unit || 'm2', layers: U.clone(layers), ds };
};
S.saveSolution = function (sol) { S.change(() => { const a = S.p.solutions; const i = a.findIndex(x => x.id === sol.id); if (i >= 0) a[i] = sol; else a.push(sol); }, 'sol'); };
S.delSolution = function (id) { S.change(() => { S.p.solutions = S.p.solutions.filter(x => x.id !== id); }, 'sol'); };
S.localSols = [];
S.loadLocalSols = async function () { const a = await GC.store.get('sollib'); S.localSols = Array.isArray(a) ? a : []; };
S.saveLocalSols = async function () { return GC.store.set('sollib', S.localSols); };
/* totes les solucions disponibles (projecte + llibreria local), sense duplicar ids */
S.allSols = function () { const seen = new Set(); const out = []; for (const x of S.p.solutions.map(s => Object.assign({ where: 'projecte' }, s)).concat(S.localSols.map(s => Object.assign({ where: 'local' }, s)))) { if (seen.has(x.id + x.where)) continue; seen.add(x.id + x.where); out.push(x); } return out; };
/* converteix un element simple en solució per capes (el seu dataset passa a ser la primera capa) */
S.toSolution = function (itemId) {
  const it = S.item(itemId); if (!it || it.layers) return; const d = S.dsOf(it.dsId);
  S.change(() => { const l = S.newLayer(d, { name: it.name, qty: 1, unit: d ? d.u : it.unit, conv: 1, vi: it.vi, rsl: it.rsl || null }); it.layers = d ? [l] : []; it.unit = 'm2'; it.conv = 1; it.dsId = null; it.vi = null; delete it.convWarn; });
};

/* ===== io.js ===== */
/* guaitaCO2 — importació i exportació: ÖKOBAUDAT (CSV), projectes, selecció de guaitaPreus, elements (CSV), resultats */
const IO = GC.io = {};
const fileDate = () => new Date().toISOString().slice(0, 10);

/* ---------- Biblioteca ÖKOBAUDAT ---------- */
IO.importOdb = async function (file) {
  let bar, msg, closeFn;
  const box = h('div', null, h('p', null, 'Llegint «' + file.name + '» (' + (file.size / 1048576).toFixed(1) + ' MB). Pot trigar uns segons; el fitxer es processa al teu navegador i no es puja enlloc.'),
    h('div', { class: 'progbox' }, bar = h('i')), msg = h('div', { class: 'mu' }, 'Començant…'));
  U.modal('Important la biblioteca ÖKOBAUDAT', box, [], { sticky: true, noFocus: true, onOpen: (m, c) => { closeFn = c; } });
  try {
    const t0 = Date.now();
    const r = await GC.odb.importStream(GC.odb.fileChunks(file), file.size, p => { bar.style.width = (p * 100).toFixed(0) + '%'; msg.textContent = (p * 100).toFixed(0) + ' %'; }, file.name);
    msg.textContent = 'Indexant ' + r.records.length + ' datasets…'; await U.tick();
    GC.odb.set(r.records, r.meta);
    msg.textContent = 'Desant al navegador…'; await U.tick();
    const ok = await GC.odb.save();
    closeFn();
    const m = r.meta;
    U.status('Biblioteca importada: ' + m.datasets + ' datasets (' + ((Date.now() - t0) / 1000).toFixed(1) + ' s)' + (ok ? '' : ' · no s\'ha pogut desar al navegador'), ok ? 'ok' : 'wr', 8000);
    if (GC.S.p && !GC.S.p.source.release && m.release) GC.S.p.source.release = m.release;
    GC.S.view = 'lib'; GC.refresh('lib');
  } catch (e) {
    closeFn && closeFn();
    U.info('No s\'ha pogut importar', h('div', { class: 'msg er' }, String(e && e.message || e)));
  }
};

/* ---------- Detecció del tipus de fitxer ---------- */
IO.openFile = async function (file) {
  if (!file) return;
  const name = file.name.toLowerCase();
  try {
    if (name.endsWith('.json')) return await IO.openJson(file);
    if (name.endsWith('.csv') || name.endsWith('.txt')) {
      const head = await U.readText(file.slice(0, 4096), 'windows-1252');
      if (/^﻿?UUID;Version;/.test(head)) return await IO.importOdb(file);
      return await IO.importItemsCsv(file);
    }
    U.info('Fitxer no reconegut', h('div', null, 'guaitaCO2 llegeix el CSV d\'ÖKOBAUDAT, projectes i casos (JSON), seleccions de guaitaPreus (JSON) i llistes d\'elements (CSV).'));
  } catch (e) { U.info('Error en obrir el fitxer', h('div', { class: 'msg er' }, String(e && e.message || e))); }
};
IO.pick = async function (accept) { const f = await U.pickFile(accept); if (f) await IO.openFile(f); };

/* ---------- JSON ---------- */
IO.openJson = async function (file) {
  let o; try { o = JSON.parse(await U.readText(file, 'utf-8')); } catch (e) { throw new Error('El fitxer JSON no és vàlid: ' + e.message); }
  return IO.applyJson(o, file.name);
};
IO.applyJson = async function (o, fname) {
  const S = GC.S;
  if (o && o.format === 'guaitaCO2-projecte') {
    if (S.p && S.items().length && !await U.confirm('Obre el projecte', 'S\'obrirà «' + (o.name || fname) + '» i es substituirà el projecte actual. Si no l\'has desat, es pot recuperar amb Desfés.', 'Obre')) return;
    S.setProject(S.normalize(o)); S.view = 'obra'; GC.refresh('proj'); U.status('Projecte obert: ' + (o.name || fname), 'ok', 5000); return;
  }
  if (o && o.format === 'guaitaCO2-cas') {
    if (!o.project) throw new Error('El cas no conté cap projecte.');
    const p = S.normalize(o.project); p.caseInfo = { title: o.title || p.name, intro: o.intro || '', goal: o.goal || null };
    S.setProject(p); S.view = 'obra'; GC.refresh('proj'); GC.help.showCase(); return;
  }
  if (o && o.format === 'guaitaPreus-seleccio') return IO.addSelection(o);
  throw new Error('Format JSON no reconegut' + (o && o.format ? ' («' + o.format + '»)' : '') + '. Formats acceptats: guaitaCO2-projecte, guaitaCO2-cas, guaitaPreus-seleccio.');
};
/* selecció de guaitaPreus: {format:'guaitaPreus-seleccio', base, items:[{code, unit, summary, qty, price, chapter}]} */
IO.addSelection = function (o) {
  const S = GC.S; const arr = Array.isArray(o.items) ? o.items : [];
  if (!arr.length) throw new Error('La selecció no conté cap concepte.');
  let n = 0;
  S.change(() => {
    for (const x of arr) {
      const price = x.price == null || x.price === '' ? null : Number(x.price);
      S.items().push(S.newItem({ name: [x.code, x.summary].filter(Boolean).join(' · ') || 'Concepte', group: x.chapter || o.base || '', unit: M.itemUnit(x.unit), qty: x.qty == null ? 1 : Number(x.qty) || 0, price: isNaN(price) ? null : price, note: x.code ? 'Codi ' + x.code + (o.base ? ' · ' + o.base : '') : '' }));
      n++;
    }
  });
  S.view = 'obra'; GC.refresh('proj'); U.status(n + ' conceptes afegits. Assigna-hi un dataset d\'ÖKOBAUDAT a cadascun.', 'ok', 8000);
};

/* ---------- CSV d'elements ---------- */
IO.importItemsCsv = async function (file) {
  const txt = (await U.readText(file, 'utf-8')).replace(/^﻿/, '');
  const first = txt.split(/\r?\n/, 1)[0] || ''; const delim = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  const rows = []; const p = new GC.M.CsvParser(r => rows.push(r), delim); p.feed(txt); p.end();
  if (rows.length < 2) throw new Error('El CSV no té cap fila de dades.');
  const hd = rows[0].map(s => GC.odb.norm(s).trim()); const col = (...names) => { for (const n of names) { const i = hd.indexOf(n); if (i >= 0) return i; } return -1; };
  const cN = col('nom', 'name', 'element', 'descripcio', 'resum'), cU = col('unitat', 'unit', 'ud', 'u'), cQ = col('quantitat', 'qty', 'amidament', 'quantity'), cP = col('preu', 'price', 'preu unitari'), cG = col('grup', 'group', 'capitol'), cD = col('dataset', 'uuid');
  if (cN < 0) throw new Error('Cal una columna «nom» (o name). Columnes reconegudes: nom, unitat, quantitat, preu, grup, dataset (UUID).');
  const S = GC.S; let n = 0, linked = 0;
  S.change(() => {
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i]; if (!r[cN]) continue; const q = cQ >= 0 ? U.numIn(r[cQ]) : 1; const pr = cP >= 0 ? U.numIn(r[cP]) : null;
      const it = S.newItem({ name: r[cN], unit: cU >= 0 ? M.itemUnit(r[cU]) : '?', qty: q == null || isNaN(q) ? 1 : q, price: pr == null || isNaN(pr) ? null : pr, group: cG >= 0 ? r[cG] : '' });
      if (cD >= 0 && r[cD]) { const d = GC.odb.get(r[cD].trim()); if (d) { S.keepDs(d); it.dsId = d.id; const s = C.suggest(it.unit, d); it.conv = s ? s.f : 1; if (it.unit === '?') it.unit = d.u; linked++; } }
      S.items().push(it); n++;
    }
  });
  S.view = 'obra'; GC.refresh('proj'); U.status(n + ' elements importats (' + linked + ' amb dataset).', 'ok', 6000);
};

/* ---------- Exportacions ---------- */
IO.saveProject = function () {
  const S = GC.S; S.p.modified = new Date().toISOString();
  U.download(U.slug(S.p.name) + '_guaitaCO2.json', JSON.stringify(S.p, null, 1), 'application/json;charset=utf-8'); U.status('Projecte desat com a JSON.', 'ok', 4000);
};
IO.exportCase = async function () {
  const S = GC.S; const ci = S.p.caseInfo || {};
  const a = await U.ask('Exporta com a cas didàctic', [{ k: 't', l: 'Títol del cas', v: ci.title || S.p.name }, { k: 'i', l: 'Enunciat (el veurà l\'alumne en obrir-lo)', v: ci.intro || '', type: 'area' }, { k: 'g1', l: 'Objectiu: reducció mínima de CO₂e respecte a l\'escenari base (%, opcional)', v: ci.goal && ci.goal.minReductionPct != null ? ci.goal.minReductionPct : '' }, { k: 'g2', l: 'Objectiu: increment màxim de cost (%, opcional)', v: ci.goal && ci.goal.maxCostIncreasePct != null ? ci.goal.maxCostIncreasePct : '' }], 'El fitxer inclou el projecte complet amb els valors dels datasets, perquè l\'alumne no necessiti la biblioteca.', 'Exporta');
  if (!a) return; const g1 = U.numIn(a.g1), g2 = U.numIn(a.g2);
  const goal = (g1 != null && !isNaN(g1)) || (g2 != null && !isNaN(g2)) ? { minReductionPct: g1 != null && !isNaN(g1) ? g1 : null, maxCostIncreasePct: g2 != null && !isNaN(g2) ? g2 : null } : null;
  const o = { format: 'guaitaCO2-cas', version: VERSION, title: a.t, intro: a.i, goal, exported: new Date().toISOString(), project: S.p };
  U.download(U.slug(a.t) + '_cas.json', JSON.stringify(o, null, 1), 'application/json;charset=utf-8');
};
IO.rowsFor = function (scn) {
  const S = GC.S; const res = S.res(scn); const ind = M.IND[S.p.settings.ind];
  const head = ['Escenari', 'Grup', 'Element', 'Dataset', 'Tipus', 'País', 'Ud dataset', 'Quantitat', 'Ud element', 'Factor de conversió', 'Preu unitari (€/ud element)', 'Cost (€)']
    .concat(M.MODS.map(m => m + ' (kg CO2e)'), ['Total comptat (kg CO2e)', 'Mòduls amb dada', 'Estat']);
  const out = [head];
  for (const x of res.rows) {
    const r = x.r; out.push([scn.name, x.it.group, x.it.name, x.ds ? (x.ds.composite ? 'Solució: ' + x.it.layers.map(l => (S.dsOf(l.dsId) || {}).n || '?').join(' + ') : x.ds.n) : '', x.ds ? x.ds.typ : '', x.ds ? x.ds.land : '', x.ds ? x.ds.u : '', x.it.qty, x.it.unit, x.it.conv, r.up, r.cost]
      .concat(M.MODS.map(m => r.mods[m]), [r.tot, r.nd + '/' + S.ctx().counted.length, r.status]));
  }

/* ===== help.js ===== */
/* guaitaCO2 — ajuda, glossari, limitacions i enunciat de cas didàctic */
const HP = GC.help = {};

HP.html = () => `
<h2>Què és guaitaCO2</h2>
<p>Una eina independent i pedagògica per <b>escollir materials i solucions constructives també pel seu CO₂e embegut</b>, no només pel cost. Treballes amb una «obra» (llista d'elements amb quantitat), hi assignes datasets d'ÖKOBAUDAT i veus el resultat per mòdul del cicle de vida, els punts calents i l'efecte de substituir materials.</p>
<h2>Com es treballa</h2>
<ol>
<li><b>Biblioteca</b>: importa una vegada el CSV d'ÖKOBAUDAT (Fitxer ▸ Importa ÖKOBAUDAT). Queda desat al teu navegador.</li>
<li><b>Obra</b>: afegeix elements des de la biblioteca, a mà, des d'un CSV o des d'una selecció de guaitaPreus. Indica la quantitat i la unitat de l'element.</li>
<li><b>Mòduls comptats</b>: a la barra superior tria quines fases sumen al total (per defecte A1–A3). D es mostra sempre a part.</li>
<li><b>Alternatives</b> (icona ⇄ a cada fila): llista datasets de la mateixa unitat i categoria amb Δ CO₂e i Δ cost. El nivell de categoria es tria sol (el més específic amb almenys 3 alternatives) i el pots canviar.</li>
<li><b>Solucions per capes</b> (Edita ▸ Solucions per capes…): un mur, un forjat o una coberta com a llista de capes per m². Es poden desar al projecte o a la llibreria local del navegador i substituir per altres solucions o capa a capa.</li>
<li><b>Escenaris</b>: copia l'obra, fes-hi substitucions i compara'n els totals, amb una <b>cascada</b> element a element. <b>Anàlisi</b>: fases, grups, punts calents i referències per m².</li>
<li><b>Informe</b> (Fitxer ▸ Informe imprimible…): resum, fases, elements, escenaris, hipòtesis i font, llest per imprimir o desar com a PDF.</li>
</ol>
<h2>Els mòduls (EN 15978 / EN 15804+A2)</h2>
<table><tr><td><b>A1–A3</b></td><td>Producte: matèries primeres, transport a fàbrica, fabricació</td></tr>
<tr><td><b>A4–A5</b></td><td>Transport a obra i instal·lació</td></tr>
<tr><td><b>B1–B7</b></td><td>Ús: manteniment, reparació, substitució, rehabilitació, energia i aigua operatives</td></tr>
<tr><td><b>C1–C4</b></td><td>Final de vida: desconstrucció, transport, tractament, eliminació</td></tr>
<tr><td><b>D</b></td><td>Beneficis i càrregues fora dels límits del sistema (reutilització, recuperació, reciclatge). <b>No se suma</b> als altres mòduls.</td></tr></table>
<h2>Indicadors</h2>
<p>Tots en <b>kg CO₂e</b> (equivalents de CO₂). <b>GWP-total</b> = fòssil + biogènic + luluc. <i>Biogènic</i>: carboni emès o captat per biomassa (p. ex. fusta). <i>Luluc</i>: canvi d'ús del sòl. Pots canviar d'indicador a la barra superior.</p>
<h2>Regles que cal recordar</h2>
<ul>
<li><b>«·» (sense dada) no és zero.</b> Un mòdul no declarat no es pot comparar com si valgués 0. Els elements amb dades parcials s'avisen i el total és un mínim.</li>
<li><b>Compara per unitat funcional</b>, no per quilo de material: 1 m² de mur amb la mateixa prestació, no 1 kg de maó contra 1 kg de formigó.</li>
<li><b>Factor de conversió</b>: si l'element és en m³ i el dataset en kg, cal una densitat. L'eina proposa un factor a partir de les dades del dataset i l'has de revisar.</li>
<li><b>Variants d'escenari</b>: alguns mòduls (B, C, D) porten diverses variants. Per defecte s'usa la que no té escenari (o S0/S1); es pot canviar a l'element.</li>
<li><b>Tipus de dataset</b>: <i>mitjana</i> i <i>genèric</i> són valors sectorials; <i>específic</i> és d'un fabricant concret. No barregis sense saber-ho.</li>
<li><b>Vida útil i B4</b>: si un element té vida útil (anys), B4 es pot calcular com (⌈període/vida⌉−1) × (A1–A5 + C1–C4 declarats). A la barra superior tries si s'usa el B4 del dataset o el calculat; a l'obra es mostren els dos valors.</li>
<li><b>Referències per m²</b>: valors orientatius d'edifici complet (LETI, RIBA) amb la font citada; només comparables si comptes els mateixos mòduls.</li>
<li><b>Preu d'ombra del carboni</b> (€/t): opcional i buit per defecte. Si l'informes, es calcula «cost + CO₂e × preu». És un criteri de decisió, no un cost real.</li>
</ul>
<h2>Limitacions</h2>
<ul>
<li>ÖKOBAUDAT és una base alemanya: pot no reflectir mixos energètics ni transports de la Península. Útil per a ordres de magnitud i per a decisions relatives; no per certificar.</li>
<li>No substitueix una ACV d'edifici ni una EPD. L'ÖKOBAUDAT no està pensada per fer l'ACV d'un producte. No barregis dades d'A1–A3 amb mòduls d'una altra base.</li>
<li>Les dades queden al teu navegador; esborrar les dades del lloc les elimina. Desa el projecte en JSON per conservar-lo.</li>
</ul>
<h2>Font i llicència</h2>
<p>Dades: ÖKOBAUDAT, BMWSB / BBSR (<a class="ext" href="https://www.oekobaudat.de" target="_blank" rel="noopener noreferrer">oekobaudat.de</a>), d'ús gratuït citant la font. L'eina no inclou ni redistribueix les dades: cada usuari les descarrega i les importa. Programari: AGPL-3.0-only · © SBS BiM Consulting, Jordi Subirós.</p>
<h2>Atalls</h2>
<p>A l'obra, marca les caselles per fer <b>edicions massives</b> (grup, vida útil, preu, duplica, elimina); <code>Maj</code>+clic selecciona un interval. Els filtres de la biblioteca es recorden.</p>
<p><code>Ctrl+Z</code> / <code>Ctrl+Y</code> desfés i refés · <code>Ctrl+S</code> desa el projecte · <code>F1</code> aquesta ajuda · <code>Esc</code> tanca els diàlegs.</p>`;

/* estat de l'objectiu d'un cas: l'escenari actiu es compara amb el primer escenari del projecte */
HP.goalStatus = function () {
  const ci = S.p && S.p.caseInfo; if (!ci || !ci.goal) return null; const res0 = S.res(S.p.scenarios[0]), res1 = S.res();
  const red = res0.total ? (res0.total - res1.total) / Math.abs(res0.total) * 100 : null;
  const dc = res0.costMiss === 0 && res1.costMiss === 0 && res0.cost ? (res1.cost - res0.cost) / res0.cost * 100 : null;
  const g = ci.goal; return { g, red, dc, base: S.p.scenarios[0].name, okR: g.minReductionPct == null ? null : (red != null && red >= g.minReductionPct), okC: g.maxCostIncreasePct == null ? null : (dc != null && dc <= g.maxCostIncreasePct) };
};
HP.showCase = function () {
  const ci = S.p && S.p.caseInfo; if (!ci) { U.info('Cas didàctic', 'Aquest projecte no té cap enunciat. Carrega un cas (JSON) o exporta\'n un des de Fitxer ▸ Exporta ▸ Cas didàctic.'); return; }
  const body = h('div', { class: 'helpdoc' }, h('p', { style: { whiteSpace: 'pre-wrap' } }, ci.intro || '(sense enunciat)')); const gs = HP.goalStatus();
  if (gs) {
    body.appendChild(h('h2', null, 'Objectiu'));
    body.appendChild(h('ul', null,
      gs.g.minReductionPct != null ? h('li', null, 'Reduir el CO₂e com a mínim un ' + gs.g.minReductionPct + ' % respecte a l\'escenari «' + gs.base + '». Ara: ' + (gs.red == null ? '—' : U.fmt(gs.red, 1) + ' %') + ' ' + (gs.okR ? '✔' : '✘')) : null,
      gs.g.maxCostIncreasePct != null ? h('li', null, 'Cost: com a màxim ' + gs.g.maxCostIncreasePct + ' % més. Ara: ' + (gs.dc == null ? 'cal preu a tots els elements' : U.fmtPct(gs.dc)) + ' ' + (gs.okC ? '✔' : '✘')) : null));
    body.appendChild(h('div', { class: 'hint' }, 'S\'avalua l\'escenari actiu contra el primer escenari del projecte.'));
  }
  return U.info(ci.title || 'Cas didàctic', body, { cls: 'wide' });
};

  if (!S.p) return; what = what || 'proj';
  buildMenu(); buildTbar(); buildCbar(); buildVbar(); buildGbar(); buildFooter();

    return;
  }
  buildWork();
};
